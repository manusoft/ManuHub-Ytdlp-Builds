name: Update ManuHub FFmpeg Toolchain

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  
jobs:

  # ────────────────────────────────────────────────
  # Download FFmpeg Build Once
  # ────────────────────────────────────────────────
  download-build:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.get-date.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest FFmpeg build
        shell: pwsh
        run: |
          $url = "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"

      - name: Extract binaries
        shell: pwsh
        run: |
          Expand-Archive ffmpeg.zip temp -Force
          $bin = Get-ChildItem temp -Recurse -Directory -Filter "bin" | Select-Object -First 1 -ExpandProperty FullName

          mkdir tools

          Copy-Item "$bin/ffmpeg.exe" tools/
          Copy-Item "$bin/ffprobe.exe" tools/
          Copy-Item "$bin/ffplay.exe" tools/

      - name: Get version from release
        id: get-date
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/yt-dlp/FFmpeg-Builds/releases/latest" `
            -Headers @{ "User-Agent" = "GitHub-Actions" }

          $title = $release.name

          if ($title -match '\((\d{4})-(\d{2})-(\d{2})') {

            $year = [int]$Matches[1]
            $month = [int]$Matches[2]
            $day = [int]$Matches[3]

            $major = $year - 2020
            $version = "$major.$month.$day"

            echo "version=$version" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Error "Version parse failed"
            exit 1
          }

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-tools
          path: tools

  # ────────────────────────────────────────────────
  # Build Packages
  # ────────────────────────────────────────────────
  build-packages:

    needs: download-build
    runs-on: windows-latest

    strategy:
      matrix:
        tool: [ffmpeg, ffprobe, ffplay]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extracted binaries
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-tools
          path: tools

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Update project version
        shell: pwsh
        run: |
          $version = "${{ needs.download-build.outputs.version }}"
          $csproj = "src/ManuHub.${{ matrix.tool }}/ManuHub.${{ matrix.tool }}.csproj"

          $content = Get-Content $csproj -Raw
          $updated = $content -replace '(?<=<Version>)[^<]+(?=</Version>)', $version

          Set-Content $csproj $updated -NoNewline

      - name: Generate nuspec
        shell: pwsh
        run: |
          $tool = "${{ matrix.tool }}"
          $version = "${{ needs.download-build.outputs.version }}"

          $proj = "src/ManuHub.$tool"
          $nuspec = "$proj/$tool.nuspec"

          $exe = "$tool.exe"

          $nuspecContent = @"
          <?xml version="1.0"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2016/06/nuspec.xsd">
            <metadata>
              <id>ManuHub.$tool</id>
              <version>$version</version>
              <authors>Manojbabu</authors>
              <company>ManuHub</company>
              <description>Provides the latest stable $exe Windows binary as a NuGet package.</description>
              <projectUrl>https://ffmpeg.org</projectUrl>
              <repository type="git" url="https://github.com/manusoft/ManuHub-Ytdlp-Builds"/>
              <tags>$tool;$tool.exe;ffmpeg;binary;tools</tags>
              <requireLicenseAcceptance>true</requireLicenseAcceptance>
              <license type="file">LICENSE.txt</license>
              <icon>icon.png</icon>
              <readme>README.md</readme>

              <contentFiles>
                <files include="any/netstandard2.1/tools/$exe"
                       buildAction="None"
                       copyToOutput="true"
                       flatten="false" />
              </contentFiles>
            </metadata>

            <files>
              <file src="icon.png" target="" />
              <file src="README.md" target="" />
              <file src="LICENSE.txt" target="" />
              <file src="THIRD-PARTY-NOTICES.txt" target="" />
              <file src="../../tools/$exe" target="contentFiles/any/netstandard2.1/tools/$exe" />
            </files>

          </package>
          "@

          $nuspecContent | Out-File $nuspec -Encoding utf8NoBOM

      - name: Pack NuGet
        shell: pwsh
        run: |
          $tool = "${{ matrix.tool }}"
          cd src/ManuHub.$tool

          dotnet restore
          dotnet pack -c Release -p:NuspecFile="$tool.nuspec" --no-build

      - name: Push to NuGet
        shell: pwsh
        run: |
          $tool = "${{ matrix.tool }}"
          $pkg = Get-ChildItem "src/ManuHub.$tool/bin/Release/*.nupkg" | Select -First 1

          dotnet nuget push $pkg `
            --api-key "${{ secrets.NUGET_KEY }}" `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate