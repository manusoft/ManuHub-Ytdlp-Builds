name: Release ManuHub.Ytdlp

on:
  workflow_dispatch:      # Allows manual trigger from GitHub UI
  schedule:
    - cron: "0 3 * * *"   # Daily at 3:00 UTC
    
permissions:
  contents: read
  id-token: write
  
jobs:
  update-ytdlp:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────
      # Download yt-dlp.exe
      # ─────────────────────────────
      - name: Download latest yt-dlp.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools
          $url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          Invoke-WebRequest -Uri $url -OutFile "tools/yt-dlp.exe" -UseBasicParsing

      # ─────────────────────────────
      # Get Version
      # ─────────────────────────────
      - name: Convert yt-dlp version to NuGet version
        id: convert-version
        shell: pwsh
        run: |
          # Execute yt-dlp and capture its output
          $output = & tools/yt-dlp.exe --version 2>&1
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
              throw "yt-dlp version command failed with exit code $exitCode. Output: $output"
          }

          $line = ($output | Select-Object -First 1).ToString().Trim()

          Write-Output "Upstream yt-dlp version: $line"

          # Expected format: 2026.10.29
          if ($line -match '^(\d{4})\.(\d{1,2})\.(\d{1,2})$') {

              $year  = [int]$Matches[1]
              $month = [int]$Matches[2]
              $day   = [int]$Matches[3]

              if ($month -lt 1 -or $month -gt 12 -or
                  $day -lt 1 -or
                  $day -gt [DateTime]::DaysInMonth($year, $month)) {
                  throw "Invalid yt-dlp release date: $line"
              }

              $major = $year - 2020
              $packageVersion = "$major.$month.$day"

              Write-Output "NuGet package version: $packageVersion"

              "upstream_version=$line" >> $env:GITHUB_OUTPUT
              "version=$packageVersion" >> $env:GITHUB_OUTPUT
          }
          else {
              throw "Unexpected yt-dlp version format: $line"
          }

      - name: Update .csproj version
        shell: pwsh
        run: |
          $version = "${{ steps.convert-version.outputs.version }}"
          $csprojPath = "src/ManuHub.Ytdlp/ManuHub.Ytdlp.csproj"
          
          if (-Not (Test-Path $csprojPath)) {
            Write-Error "csproj not found at $csprojPath"
            exit 1
          }
          
          $content = Get-Content $csprojPath -Raw
          $updated = $content -replace '(?<=<Version>)[^<]+(?=</Version>)', $version
          Set-Content $csprojPath $updated -NoNewline

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify binaries exist before pack
        shell: pwsh
        run: |
          Get-ChildItem tools -ErrorAction SilentlyContinue | Format-Table FullName, @{Name='SizeMB';Expression={[math]::Round($_.Length / 1MB, 2)}}
          if (-Not (Test-Path tools/yt-dlp.exe)) { Write-Error "yt-dlp.exe MISSING!"; exit 1 }

      - name: Generate yt-dlp .nuspec
        shell: pwsh
        run: |
          $version = "${{ steps.convert-version.outputs.version }}"
          $projectDir = "src/ManuHub.Ytdlp"
          $nuspecPath = "$projectDir/ytdlp.nuspec"
          $nuspec = @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2016/06/nuspec.xsd">
            <metadata>
              <id>ManuHub.Ytdlp</id>
              <version>$version</version>
              <authors>Manojbabu</authors>
              <company>ManuHub</company>
              <description>Provides the latest stable yt-dlp.exe Windows binary as a NuGet package.</description>
              <projectUrl>https://github.com/yt-dlp/yt-dlp</projectUrl>
              <repository type="git" url="https://github.com/manusoft/ManuHub-Ytdlp-Builds" />
              <tags>yt-dlp;yt-dlp.exe;ytdlp;ytdlp.exe;stable</tags>
              <copyright>Copyright © $([System.DateTime]::Now.Year) ManuHub</copyright>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <license type="file">LICENSE.txt</license>
              <icon>icon.png</icon>
              <readme>README.md</readme>
              <contentFiles>
                <files include="any/netstandard2.0/tools/yt-dlp.exe"
                     buildAction="None"
                     copyToOutput="true"
                     flatten="false" />
              </contentFiles>      
              <dependencies>
                <group targetFramework=".NETStandard2.0" />
              </dependencies>
            </metadata>
            <files>
              <file src="icon.png" target="" />
              <file src="README.md" target="" />
              <file src="LICENSE.txt" target="" />
              <file src="THIRD-PARTY-NOTICES.txt" target="" />
              <file src="../../tools/yt-dlp.exe" target="contentFiles/any/netstandard2.0/tools/yt-dlp.exe"  />
            </files>
          </package>
          "@
          $nuspec | Out-File -FilePath $nuspecPath -Encoding utf8NoBOM
          Write-Output "Generated $nuspecPath with version $version"
          
      - name: Pack yt-dlp package using .nuspec
        shell: pwsh
        run: |
          dotnet restore "src/ManuHub.Ytdlp/ManuHub.Ytdlp.csproj"
          Set-Location src/ManuHub.Ytdlp
          dotnet pack ManuHub.Ytdlp.csproj -c Release `
            -p:NuspecFile=ytdlp.nuspec `
            --no-build
          Set-Location ../../..

      - name: Check if version changed (informational)
        shell: pwsh
        run: |
          Write-Output "Current computed version: ${{ steps.convert-version.outputs.version }}"
          # Optional: you could git diff the csproj here to see if <Version> actually changed

      - name: Check .nupkg size before push (debug)
        shell: pwsh
        run: |
          $nupkgPath = Get-ChildItem "src/ManuHub.Ytdlp/bin/Release" -Filter "*.nupkg" `
            | Select-Object -First 1 -ExpandProperty FullName
          if ($nupkgPath) {
            $sizeBytes = (Get-Item $nupkgPath).Length
            $sizeMB = [math]::Round($sizeBytes / 1MB, 2)
            Write-Output "Package path: $nupkgPath"
            Write-Output "Package size: $sizeMB MB ($sizeBytes bytes)"
            if ($sizeMB -lt 5) {
              Write-Warning "WARNING: Package is suspiciously small (<5 MB) — binary likely missing!"
            } else {
              Write-Output "Size looks correct."
            }
          } else {
            Write-Error "No .nupkg found after pack"
            exit 1
          }

      - name: Authenticate with NuGet.org (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER1 }}

      - name: Push yt-dlp package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem "src/ManuHub.Ytdlp/bin/Release" -Filter "*.nupkg" | Select-Object -First 1 -ExpandProperty FullName

          if (-not $nupkg) {
            Write-Error "No NuGet package found!"
            exit 1
          }
          
          dotnet nuget push "$nupkg" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source "https://api.nuget.org/v3/index.json" `
            --skip-duplicate
            
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NuGet publishing failed!"
            exit $LASTEXITCODE
          }