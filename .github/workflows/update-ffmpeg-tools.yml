name: Update ManuHub FFmpeg Toolchain

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build-packages:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download latest FFmpeg build
        shell: pwsh
        run: |
          mkdir tools

          $url = "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"

          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"

      - name: Extract binaries
        shell: pwsh
        run: |
          Expand-Archive ffmpeg.zip temp -Force

          $bin = Get-ChildItem temp -Recurse -Directory -Filter "bin" |
                 Select-Object -First 1 -ExpandProperty FullName

          Copy-Item "$bin/ffmpeg.exe" tools/
          Copy-Item "$bin/ffprobe.exe" tools/
          Copy-Item "$bin/ffplay.exe" tools/

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/yt-dlp/FFmpeg-Builds/releases/latest" `
            -Headers @{ "User-Agent" = "GitHub-Actions" }

          $title = $release.name

          if ($title -match '\((\d{4})-(\d{2})-(\d{2})') {

            $year = [int]$Matches[1]
            $month = [int]$Matches[2]
            $day = [int]$Matches[3]

            $major = $year - 2020
            $version = "$major.$month.$day"

            echo "version=$version" >> $env:GITHUB_OUTPUT
          }

      - name: Build FFmpeg package
        shell: pwsh
        run: |
          $version="${{ steps.version.outputs.version }}"

          (Get-Content src/ManuHub.FFmpeg/ManuHub.FFmpeg.csproj -Raw) `
          -replace '(?<=<Version>)[^<]+(?=</Version>)',$version `
          | Set-Content src/ManuHub.FFmpeg/ManuHub.FFmpeg.csproj

          cd src/ManuHub.FFmpeg
          dotnet restore
          dotnet pack -c Release --no-build
          cd ../..

      - name: Build FFprobe package
        shell: pwsh
        run: |
          $version="${{ steps.version.outputs.version }}"

          (Get-Content src/ManuHub.FFprobe/ManuHub.FFprobe.csproj -Raw) `
          -replace '(?<=<Version>)[^<]+(?=</Version>)',$version `
          | Set-Content src/ManuHub.FFprobe/ManuHub.FFprobe.csproj

          cd src/ManuHub.FFprobe
          dotnet restore
          dotnet pack -c Release --no-build
          cd ../..

      - name: Build FFplay package
        shell: pwsh
        run: |
          $version="${{ steps.version.outputs.version }}"

          (Get-Content src/ManuHub.FFplay/ManuHub.FFplay.csproj -Raw) `
          -replace '(?<=<Version>)[^<]+(?=</Version>)',$version `
          | Set-Content src/ManuHub.FFplay/ManuHub.FFplay.csproj

          cd src/ManuHub.FFplay
          dotnet restore
          dotnet pack -c Release --no-build
          cd ../..

      - name: Push packages
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_ `
              --api-key "${{ secrets.NUGET_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }
