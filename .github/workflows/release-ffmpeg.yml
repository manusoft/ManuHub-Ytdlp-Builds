name: Release ManuHub FFmpeg Toolchain

on:
  workflow_dispatch:      # Allows manual trigger from GitHub UI
  schedule:
    - cron: "0 3 * * 0"  # Only on Sunday at 3:00 UTC  

permissions:
  packages: write
  contents: read
  
jobs:
  build-packages:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # ─────────────────────────────
      # Download FFmpeg Build
      # ─────────────────────────────
      - name: Download latest FFmpeg build
        shell: pwsh
        run: |
          mkdir tools

          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip

      - name: Extract binaries
        shell: pwsh
        run: |
          Expand-Archive ffmpeg.zip temp -Force

          $bin = Get-ChildItem temp -Recurse -Directory -Filter "bin" |
                 Select-Object -First 1 -ExpandProperty FullName

          Copy-Item "$bin/ffmpeg.exe" tools/
          Copy-Item "$bin/ffprobe.exe" tools/
          Copy-Item "$bin/ffplay.exe" tools/

      # ─────────────────────────────
      # Get Version
      # ─────────────────────────────
      - name: Get FFmpeg version
        id: version
        shell: pwsh
        run: |
          $line = (& tools/ffmpeg.exe -version 2>&1 | Select-Object -First 1)
      
          if ($line -match '^ffmpeg version (N-\d+-g[0-9a-f]+-(\d{8}))') {
              $upstreamVersion = $Matches[1]
              $buildDate = $Matches[2]
      
              $year  = $buildDate.Substring(0, 4)
              $month = [int]$buildDate.Substring(4, 2)
              $day   = [int]$buildDate.Substring(6, 2)
      
              $packageVersion = "$year.$month.$day"
      
              Write-Host "Upstream FFmpeg: $upstreamVersion"
              Write-Host "Package version:  $packageVersion"
      
              "upstream_version=$upstreamVersion" >> $env:GITHUB_OUTPUT
              "version=$packageVersion" >> $env:GITHUB_OUTPUT
          }
          else {
              throw "Unable to parse FFmpeg version: $line"
          }

      # ─────────────────────────────
      # Function: Build Package
      # ─────────────────────────────
      - name: Build FFmpeg package
        shell: pwsh
        run: |
          $version="${{ steps.version.outputs.version }}"
          $proj="src/ManuHub.FFmpeg"
          $exe="ffmpeg.exe"
          $id="ManuHub.FFmpeg"

          $nuspec="$proj/ffmpeg.nuspec"

          @"
          <?xml version="1.0"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2016/06/nuspec.xsd">
            <metadata>
              <id>$id</id>
              <version>$version</version>
              <authors>Manojbabu</authors>
              <company>ManuHub</company>
              <description>Provides the latest stable ffmpeg.exe Windows binary as a NuGet package.</description>
              <projectUrl>https://ffmpeg.org</projectUrl>
              <repository type="git" url="https://github.com/manusoft/ManuHub-Ytdlp-Builds"/>
              <tags>ffmpeg;ffmpeg.exe;ytdlp;yt-dlp;binary;tools</tags>
              <requireLicenseAcceptance>true</requireLicenseAcceptance>
              <license type="file">LICENSE.txt</license>
              <icon>icon.png</icon>
              <readme>README.md</readme>
              <contentFiles>
                <files include="any/netstandard2.0/tools/$exe"
                       buildAction="None"
                       copyToOutput="true"
                       flatten="false"/>
              </contentFiles>
              <dependencies>
                <group targetFramework=".NETStandard2.0" />
              </dependencies>
            </metadata>
            <files>
              <file src="icon.png" target="" />
              <file src="README.md" target="" />
              <file src="LICENSE.txt" target="" />
              <file src="THIRD-PARTY-NOTICES.txt" target="" />
              <file src="../../tools/$exe" target="contentFiles/any/netstandard2.0/tools/$exe" />
            </files>

          </package>
          "@ | Out-File $nuspec -Encoding utf8NoBOM

          cd $proj
          dotnet restore
          dotnet pack -c Release -p:NuspecFile=ffmpeg.nuspec --no-build
          cd ../..

      # ─────────────────────────────
      # FFprobe
      # ─────────────────────────────
      - name: Build FFprobe package
        shell: pwsh
        run: |
          $version="${{ steps.version.outputs.version }}"
          $proj="src/ManuHub.FFprobe"
          $exe="ffprobe.exe"
          $id="ManuHub.FFprobe"

          $nuspec="$proj/ffprobe.nuspec"

          @"
          <?xml version="1.0"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2016/06/nuspec.xsd">
            <metadata>
              <id>$id</id>
              <version>$version</version>
              <authors>Manojbabu</authors>
              <company>ManuHub</company>
              <description>Provides the latest stable ffprobe.exe Windows binary as a NuGet package.</description>
              <projectUrl>https://ffmpeg.org</projectUrl>
              <repository type="git" url="https://github.com/manusoft/ManuHub-Ytdlp-Builds"/>
              <tags>ffprobe;ffprobe.exe;ytdlp;yt-dlp;binary;tools</tags>
              <requireLicenseAcceptance>true</requireLicenseAcceptance>
              <license type="file">LICENSE.txt</license>
              <icon>icon.png</icon>
              <readme>README.md</readme>
              <contentFiles>
                <files include="any/netstandard2.0/tools/$exe"
                       buildAction="None"
                       copyToOutput="true"
                       flatten="false"/>
              </contentFiles>
              <dependencies>
                <group targetFramework=".NETStandard2.0" />
              </dependencies>
            </metadata>
            <files>
              <file src="icon.png" target="" />
              <file src="README.md" target="" />
              <file src="LICENSE.txt" target="" />
              <file src="THIRD-PARTY-NOTICES.txt" target="" />
              <file src="../../tools/$exe" target="contentFiles/any/netstandard2.0/tools/$exe" />
            </files>

          </package>
          "@ | Out-File $nuspec -Encoding utf8NoBOM

          cd $proj
          dotnet restore
          dotnet pack -c Release -p:NuspecFile=ffprobe.nuspec --no-build
          cd ../..

      # ─────────────────────────────
      # FFplay
      # ─────────────────────────────
      - name: Build FFplay package
        shell: pwsh
        run: |
          $version="${{ steps.version.outputs.version }}"
          $proj="src/ManuHub.FFplay"
          $exe="ffplay.exe"
          $id="ManuHub.FFplay"

          $nuspec="$proj/ffplay.nuspec"

          @"
          <?xml version="1.0"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2016/06/nuspec.xsd">
            <metadata>
              <id>$id</id>
              <version>$version</version>
              <authors>Manojbabu</authors>
              <company>ManuHub</company>
              <description>Provides the latest stable ffplay.exe Windows binary as a NuGet package.</description>
              <projectUrl>https://ffmpeg.org</projectUrl>
              <repository type="git" url="https://github.com/manusoft/ManuHub-Ytdlp-Builds"/>
              <tags>ffplay;ffplay.exe;ffmpeg;media;player;video;audio;binary;tools</tags>
              <requireLicenseAcceptance>true</requireLicenseAcceptance>
              <license type="file">LICENSE.txt</license>
              <icon>icon.png</icon>
              <readme>README.md</readme>
              <contentFiles>
                <files include="any/netstandard2.0/tools/$exe"
                       buildAction="None"
                       copyToOutput="true"
                       flatten="false"/>
              </contentFiles>
              <dependencies>
                <group targetFramework=".NETStandard2.0" />
              </dependencies>
            </metadata>
            <files>
              <file src="icon.png" target="" />
              <file src="README.md" target="" />
              <file src="LICENSE.txt" target="" />
              <file src="THIRD-PARTY-NOTICES.txt" target="" />
              <file src="../../tools/$exe" target="contentFiles/any/netstandard2.0/tools/$exe" />
            </files>

          </package>
          "@ | Out-File $nuspec -Encoding utf8NoBOM

          cd $proj
          dotnet restore
          dotnet pack -c Release -p:NuspecFile=ffplay.nuspec --no-build
          cd ../..

      # ─────────────────────────────
      # Push All Packages
      # ─────────────────────────────
      - name: Push packages
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.nupkg | ForEach-Object {
            # ── Publish to nuget.org ───────────────────────────────────────
            dotnet nuget push $_ `
              --api-key "${{ secrets.NUGET_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }


